<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head><body>
<script type="module">
// Profile picture renders (1:1) using the video characters
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as S from '/video07_wojtek/shots.js';
import * as L from '/video07_wojtek/lib.js';
const N = 1080, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(N, N);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.1; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement); const pm = new THREE.PMREMGenerator(r); S.setEnv(pm.fromScene(new RoomEnvironment(), 0.04).texture);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const bgTex = (c0, c1, rays = true) => L.canvasTex(1024, 1024, (g, w, h) => { const gr = g.createRadialGradient(w / 2, h * 0.45, 0, w / 2, h / 2, w * 0.75); gr.addColorStop(0, c0); gr.addColorStop(1, c1); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  if (rays) { g.save(); g.translate(w / 2, h * 0.45); g.fillStyle = 'rgba(255,255,255,0.12)'; for (let i = 0; i < 16; i++) { g.rotate(Math.PI / 8); g.beginPath(); g.moveTo(0, 0); g.lineTo(w, -w * 0.12); g.lineTo(w, w * 0.12); g.fill(); i++; g.rotate(Math.PI / 8); } g.restore(); } });
function setup(c0, c1) { const s = new THREE.Scene(); s.background = bgTex(c0, c1); S.lights(s, { dir: [4, 8, 9], sunSprite: false, si: 2.4, hi: 1.3, target: V(0, 1.4, 0), sr: 4 }); return s; }
const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 100);
const SC = {
  erzaehler() { const s = setup('#ffe27a', '#ff8a2a'); const c = S.guy(s, { skin: 0xf1b78f, shirt: 0x2f6fd6, sleeve: 0x2f6fd6, pants: 0x3a3a44, hair: 0x5a3a22, mustache: false, tie: 0xd62828, armSkin: false }, 0, 0, 0, -0.25); S.fedora(c, 0x6a4a2a);
    const m = S.magnifier(); s.add(m); m.scale.setScalar(1.9); c.g.updateMatrixWorld(true); const ep = new THREE.Vector3(); c.eyes[1].getWorldPosition(ep); m.position.copy(ep).add(V(0.02, -0.02, 0.22)); m.rotation.set(0, -0.25, 0.5);
    c.eyes[1].scale.multiplyScalar(1.45); c.pupils[1].scale.setScalar(1.45); c.arms[1].sh.rotation.set(-1.0, 0, 0.75); c.arms[1].el.rotation.set(-1.6, 0, 0); c.expr('grin'); c.eyes[1].scale.set(1.45, 1.65, 0.9); c.look(0.1, 0.2);
    cam.position.set(0.15, 1.65, 3.3); cam.lookAt(0, 1.52, 0); return s; },
  baer() { const s = setup('#7ae0d0', '#1d6fb0'); const b = S.bear(s, 0, 0, 0, { beret: true }); b.stand(0); b.expr('happy', 0); b.look(0, 0.1); b.wave(0.2, 1); b.head.rotation.z = 0.1;
    cam.position.set(0.1, 1.85, 3.4); cam.lookAt(0, 1.62, 0); return s; },
  trio() { const s = setup('#ffd86a', '#e8472f'); const c = S.guy(s, { skin: 0xf1b78f, shirt: 0x2f6fd6, sleeve: 0x2f6fd6, pants: 0x3a3a44, hair: 0x5a3a22, mustache: false, tie: 0xd62828, armSkin: false }, 0, 0, 0.3, 0); S.fedora(c, 0x6a4a2a); c.expr('grin'); c.pose('cheer'); c.look(0, 0.2);
    const b = S.bear(s, -0.95, -0.4, 0.35, { beret: true, s: 0.85 }); b.stand(0); b.expr('happy', 0); b.wave(0.3, 0); const d = S.dog(s, 0.85, 0.5, -0.4, 1.3); d.sit(0); d.happy(0); d.look(-0.2, 0.3);
    cam.position.set(0, 1.3, 6.4); cam.lookAt(-0.05, 1.05, 0); return s; } };
window.shot = (n) => { L.resetReg(); const s = SC[n](); L.REG.tickers.forEach(f => f(0.4, 0.4)); r.render(s, cam); return r.domElement.toDataURL('image/png'); };
await document.fonts.ready; window.READY = true;
</script></body></html>
