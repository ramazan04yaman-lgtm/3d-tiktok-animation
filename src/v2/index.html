// ---------- shots & camera ----------
const SHOTS=[];TL.segs.forEach((s,i)=>{const end=i+1<TL.segs.length?TL.segs[i+1].start:TL.total;const d=end-s.start;
 const n=d>3.4?3:d>2.0?2:1;const types=[['wide'],['wide','close'],['wide','close','mid']][n-1];
 types.forEach((ty,k)=>SHOTS.push({seg:s,i,type:ty,a:s.start+d*k/n,b:s.start+d*(k+1)/n}))});
SHOTS[0].a=0;SHOTS[0].type='close';if(SHOTS[1]&&SHOTS[1].i===0)SHOTS[1].type='wide';
// grain
const gc=document.createElement('canvas');gc.width=540;gc.height=960;{const g=gc.getContext('2d');const im=g.createImageData(540,960);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0)}
function captions(t){
 let s=null;for(const x of TL.segs)if(t>=x.start-.05&&t<x.start+x.dur+.15)s=x;if(!s)return;
 const words=s.text.split(' ');const L=words.reduce((a,w)=>a+w.length+1,0);let acc=0;const times=words.map(w=>{const st=s.start+s.dur*acc/L;acc+=w.length+1;return st});
 // chunk words into 1-2 word groups
 const groups=[];for(let i=0;i<words.length;){const two=i+1<words.length&&(words[i]+words[i+1]).length<=13&&!/[.,?!]$/.test(words[i]);groups.push(two?[i,i+1]:[i]);i+=two?2:1}
 let g=groups[0];for(const gr of groups)if(t>=times[gr[0]])g=gr;
 const str=g.map(i=>words[i]).join(' ').replace(/[,.]$/,'');
 ctx.save();ctx.font='800 82px Inter';ctx.textAlign='center';ctx.lineJoin='round';
 ctx.shadowColor='rgba(0,0,0,.95)';ctx.shadowBlur=22;ctx.fillStyle='#fff';ctx.fillText(str,540,1120);ctx.shadowBlur=8;ctx.fillText(str,540,1120);ctx.restore()}
function render(t){
 const frame=Math.round(t*FPS);let sh=SHOTS[0];for(const x of SHOTS)if(t>=x.a)sh=x;
 const sc=SC[sh.seg.scene];const lt=t-sh.seg.start;const segEnd=sh.i+1<TL.segs.length?TL.segs[sh.i+1].start:TL.total;const p=clamp(lt/(segEnd-sh.seg.start));
 SEED=1+(Math.floor(frame/4)%3)*1000;CNT=0;

 cx=clamp(cx,540/z,W-540/z);cy=clamp(cy,960/z,H-960/z);
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(540,960);ctx.scale(z,z);ctx.translate(-cx,-cy);sc.d(lt,p,segEnd-sh.seg.start);ctx.restore();
 // vignette + grain
 const v=ctx.createRadialGradient(540,960,500,540,960,1250);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=.07;ctx.drawImage(gc,-hash(frame)*200,-hash(frame,1)*200,1400,2400);ctx.globalAlpha=1;
 captions(t);
}
