// ================= timeline =================
const LIST=[];TL.segs.forEach((s,i)=>{const end=i+1<TL.segs.length?TL.segs[i+1].start:TL.total;const n=s.shots.length;
 // split by text length so cuts land on words
 s.shots.forEach((id,k)=>LIST.push({id,seg:s,a:s.start+(end-s.start)*k/n,b:s.start+(end-s.start)*(k+1)/n}))});
LIST[0].a=0;
window.SFX=[];LIST.forEach(sh=>(SHOTS[sh.id].sfx||[]).forEach(([dt,n])=>SFX.push([+(sh.a+dt).toFixed(3),n])));
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,cam));const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.45,.5,.9);composer.addPass(bloom);composer.addPass(new OutputPass());
const cap=document.getElementById('cap');
function captions(t){let s=null;for(const x of TL.segs)if(t>=x.start-.05&&t<x.start+x.dur+.15)s=x;if(!s){cap.textContent='';return}
 const words=s.text.split(' ');const L=words.reduce((a,w)=>a+w.length+1,0);let acc=0;const times=words.map(w=>{const st=s.start+s.dur*acc/L;acc+=w.length+1;return st});
 const groups=[];for(let i=0;i<words.length;){const two=i+1<words.length&&(words[i]+words[i+1]).length<=13&&!/[.,?!:]$/.test(words[i]);groups.push(two?[i,i+1]:[i]);i+=two?2:1}
 let g=groups[0];for(const gr of groups)if(t>=times[gr[0]])g=gr;cap.textContent=g.map(i=>words[i]).join(' ').replace(/[,.:]$/,'')}
function render(t){let sh=LIST[0];for(const x of LIST)if(t>=x.a)sh=x;const S=SHOTS[sh.id];const lt=t-sh.a,q=clamp(lt/(sh.b-sh.a));
 Object.values(CH).forEach(c=>c.visible=false);SETS.gchair.visible=true;xl.intensity=0;SETS.bag.visible=false;SETS.siren.forEach(l=>l.intensity=0);if(hphone.parent)hphone.parent.remove(hphone);buzz=0;
 pov.visible=!!S.pov;if(S.pov)drawPhone(S.pov,lt);
 boy.shirtM.color.set(S.light==='day'||S.light==='living'?DAY_SHIRT:NIGHT_SHIRT);
 lighting(S.light,S.set);S.f(lt,q);
 // phone on nightstand glow + vibration
 nsLight.intensity=buzz?2.5:0;nsScreen.material.color.setScalar(buzz?1:.05);nsPhone.position.x=-1.25+(buzz?Math.sin(t*90)*.01:0);
 // LED blink
 const ledOn=(t%1)<.55;SETS.led.material.color.set(ledOn?0xff1a3c:0x330006);SETS.ledL.intensity=ledOn?.8:0;
 // punch-in (snap zoom) and handheld drift
 cam.fov=50*(S.punch?lerp(1.25,1,ease(lt/.18)):1);cam.updateProjectionMatrix();
 cam.position.x+=Math.sin(t*1.3)*.006;cam.position.y+=Math.sin(t*1.7)*.004;
 composer.render();captions(t);document.getElementById('flash').style.opacity=0}
window.render=render;window.ready=true;
